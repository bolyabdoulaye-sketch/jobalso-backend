<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobalso — Copilote de recrutement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Quattrocento:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --blue: #187ACD;
  --blue-dark: #0D5298;
  --blue-darker: #063F79;
  --blue-light: #D0EFFF;
  --orange: #F58025;
  --red: #D30909;
  --ink: #10202E;
  --paper: #F7FAFD;
  --white: #ffffff;
  --line: #DCE7F0;
  --ok: #1E9E6B;
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 16px;
  --shadow-xs: 0 1px 2px rgba(6,20,32,0.04);
  --shadow-sm: 0 2px 8px rgba(6,20,32,0.06), 0 1px 2px rgba(6,20,32,0.04);
  --shadow-md: 0 8px 24px rgba(6,20,32,0.08), 0 2px 6px rgba(6,20,32,0.04);
  --shadow-lg: 0 24px 60px rgba(6,20,32,0.16), 0 8px 20px rgba(6,20,32,0.08);
  --ease: cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: 'Raleway', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{font-family:'Raleway',sans-serif; font-weight:800; margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit; cursor:pointer; border:none;}
input,textarea,select{font-family:inherit; font-size:14px;}
::selection{background: var(--blue-light);}

/* ---------- Shell ---------- */
.app-shell{display:flex; min-height:100vh;}

/* Sidebar */
.sidebar{
  width:248px; flex-shrink:0;
  background: var(--blue-darker);
  color:#eaf3fb;
  display:flex; flex-direction:column;
  padding:22px 16px;
  position:relative;
  overflow:hidden;
}
.sidebar::after{
  content:"";
  position:absolute; right:-60px; bottom:-60px;
  width:180px; height:180px;
  background: var(--blue);
  clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
  opacity:0.14;
}
.brand{display:flex; align-items:center; padding:4px 6px 22px 6px;}
.brand img{height:30px; width:auto; max-width:170px; display:block; object-fit:contain;}

.mode-switch{
  display:flex; background:rgba(255,255,255,0.08); border-radius:999px; padding:3px; margin-bottom:22px;
}
.mode-switch button{
  flex:1; padding:8px 10px; border-radius:999px; background:transparent; color:#c9dcec; font-weight:700; font-size:12.5px;
  transition:.18s;
}
.mode-switch button.active{background:var(--white); color:var(--blue-darker);}

.nav-group{margin-bottom:18px;}
.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:#7fa5c4; font-weight:700; padding:0 10px; margin-bottom:6px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:var(--radius-s); color:#dceaf6; font-size:13.5px; font-weight:600;
  background:transparent; width:100%; text-align:left; transition:.15s;
}
.nav-item:hover{background:rgba(255,255,255,0.08);}
.nav-item.active{background:var(--blue); color:#fff;}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--orange); flex-shrink:0;}

.sidebar-foot{margin-top:auto; padding:10px; font-size:11px; color:#6f97b8; line-height:1.5;}
.powered-by{
  display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.92); border-radius:8px;
  padding:8px 10px; margin-bottom:10px;
}
.powered-by span{font-size:10px; font-weight:700; color:#587B95; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
.powered-by img{height:20px; width:auto; display:block; object-fit:contain;}

/* Main */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 32px; border-bottom:1px solid var(--line); background:var(--white);
}
.topbar h1{font-size:20px;}
.topbar .sub{font-size:13px; color:#587B95; margin-top:3px; font-weight:500;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.pill{
  font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px; background:var(--blue-light); color:var(--blue-darker);
}
.avatar{
  width:34px;height:34px;border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
}

.view{padding:28px 32px 60px 32px; display:none; max-width:1180px;}
.view.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* Cards */
.card{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:22px; margin-bottom:18px;
}
.card-head{display:flex; align-items:center; justify-content:between; gap:12px; margin-bottom:16px;}
.card-head h3{font-size:15.5px;}
.card-head .desc{font-size:12.5px; color:#587B95; font-weight:500; margin-top:2px;}

.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
.grid-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.stat{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px;
  position:relative; overflow:hidden;
}
.stat .num{font-size:26px; font-weight:800; color:var(--blue-darker); font-family:'Raleway';}
.stat .lbl{font-size:12px; color:#587B95; font-weight:600; margin-top:2px;}
.stat.accent-ok{border-color:#bfe6d4;}
.stat.accent-ok .num{color:var(--ok);}
.stat.accent-warn .num{color:var(--orange);}
.stat.accent-low .num{color:var(--red);}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13.5px;
  transition:.15s;
}
.btn-primary{background:var(--blue); color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-secondary{background:var(--blue-light); color:var(--blue-darker);}
.btn-secondary:hover{background:#bfe1f7;}
.btn-ghost{background:transparent; color:var(--blue-darker); border:1px solid var(--line) !important;}
.btn-ghost:hover{background:var(--paper);}
.btn-orange{background:var(--orange); color:#fff;}
.btn-orange:hover{background:#dd6f16;}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--blue-darker); margin-bottom:6px;}
.field input, .field textarea, .field select{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fbfdff; font-size:13.5px;
}
.field textarea{resize:vertical; min-height:70px;}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.hint{font-size:11.5px; color:#7691a4; margin-top:4px;}

/* Tabs (creation mode) */
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--paper); margin-bottom:18px;}
.seg button{padding:7px 16px; border-radius:999px; font-size:12.5px; font-weight:700; color:#587B95; background:transparent;}
.seg button.active{background:var(--blue-darker); color:#fff;}

/* Criteria chips */
.crit-block{margin-bottom:14px;}
.crit-title{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
.crit-title .swatch{width:9px;height:9px;border-radius:2px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  display:flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:999px;
  padding:6px 10px 6px 12px; font-size:12.5px; font-weight:600;
}
.chip button{background:none; color:#9db4c4; font-size:14px; line-height:1; padding:0;}
.chip button:hover{color:var(--red);}
.chip-add{background:transparent; border:1px dashed #9db4c4; color:#587B95;}
.must .swatch{background:var(--red);}
.important .swatch{background:var(--orange);}
.nice .swatch{background:var(--blue);}

/* Applicant / candidate cards */
.cand-list{display:flex; flex-direction:column; gap:12px;}
.cand-card{
  border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; background:#fff;
  display:flex; gap:16px; align-items:flex-start;
}
.cand-score{
  width:58px;height:58px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:15px; color:#fff; position:relative;
}
.cand-main{flex:1; min-width:0;}
.cand-main .name-row{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.cand-main h4{font-size:14.5px;}
.cand-main .role{font-size:12px; color:#587B95; font-weight:600; margin-top:1px;}
.reasons{display:flex; flex-direction:column; gap:3px; margin-top:9px;}
.reasons .why{font-size:12.5px; display:flex; gap:6px; align-items:flex-start;}
.reasons .ok{color:var(--ok);}
.reasons .warn{color:var(--orange);}
.cand-actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
.bucket-title{display:flex; align-items:center; gap:8px; margin:26px 0 12px 0;}
.bucket-title h3{font-size:14px;}
.bucket-count{font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px; color:#fff;}

/* Compare table */
table.compare{width:100%; border-collapse:collapse; font-size:13px;}
table.compare th, table.compare td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:left;}
table.compare th{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:#587B95; font-weight:800;}
table.compare td.match{font-weight:800;}

/* Pipeline */
.pipeline{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.pcol{background:var(--paper); border-radius:var(--radius-m); padding:12px; min-height:160px; border:1px solid var(--line);}
.pcol h4{font-size:12.5px; margin-bottom:10px; color:var(--blue-darker); display:flex; justify-content:space-between;}
.pcard{
  background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; cursor:grab;
}
.pcard .pname{font-weight:700; font-size:13px;}
.pcard .pmove{display:flex; gap:6px; margin-top:8px;}
.pcard .pmove button{font-size:10.5px; padding:3px 7px; border-radius:6px; background:var(--blue-light); color:var(--blue-darker); font-weight:700;}

/* Candidate side */
.tag-list{display:flex; flex-wrap:wrap; gap:8px;}
.tag{background:var(--blue-light); color:var(--blue-darker); font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px;}
.opp-card{border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; background:#fff;}
.opp-left h4{font-size:14.5px;}
.opp-left .meta{font-size:12px; color:#587B95; margin-top:3px; font-weight:600;}
.opp-score{font-weight:800; font-size:20px; color:var(--blue-dark);}

.alert-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
.alert-row:last-child{border-bottom:none;}
.switch{position:relative; width:40px; height:22px; background:#d7e3ec; border-radius:999px; flex-shrink:0;}
.switch.on{background:var(--blue);}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.2s;}
.switch.on::after{left:20px;}

/* Suivi horizontal des candidatures */
.hstepper{display:flex; align-items:flex-start; margin:18px 0 6px 0; min-width:420px;}
.hstepper-wrap{overflow-x:auto; padding-bottom:4px;}
.hstep{flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; min-width:100px;}
.hstep-connector{position:absolute; top:17px; left:-50%; width:100%; height:4px; background:var(--line); z-index:0; border-radius:2px;}
.hstep:first-child .hstep-connector{display:none;}
.hstep.done .hstep-connector{background:var(--blue);}
.hstep.current .hstep-connector{background:linear-gradient(90deg,var(--blue),var(--orange));}
.hstep-dot{
  width:36px; height:36px; border-radius:50%; background:#fff; border:3px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#a9bccb;
  z-index:1; transition:.25s; flex-shrink:0;
}
.hstep.done .hstep-dot{border-color:var(--blue); background:var(--blue); color:#fff;}
.hstep.current .hstep-dot{
  border-color:var(--orange); background:var(--orange); color:#fff;
  box-shadow:0 0 0 6px rgba(245,128,37,0.16);
}
.hstep-label{font-size:12.5px; font-weight:700; margin-top:12px; color:#9db4c4;}
.hstep.done .hstep-label{color:var(--blue-darker);}
.hstep.current .hstep-label{color:var(--orange);}
.hstep-note{font-size:11px; color:#587B95; font-weight:600; margin-top:5px; max-width:150px; line-height:1.4;}
.tracking-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;}
.tracking-status-pill{font-size:11px; font-weight:800; padding:5px 12px; border-radius:999px; background:#FDE9D6; color:var(--orange); white-space:nowrap;}

.match-explain{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:14px;}
.explain-col h5{font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; color:var(--blue-darker); font-weight:800;}

.q-block{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; margin-bottom:14px;}
.q-block .qnum{font-size:11px; font-weight:800; color:var(--orange); letter-spacing:.05em; text-transform:uppercase;}
.q-block h4{margin-top:6px; font-size:14.5px;}
.feedback-item{display:flex; gap:10px; margin-bottom:8px; font-size:13px;}
.feedback-item .ic{font-weight:800;}

.empty{
  text-align:center; padding:40px 20px; color:#7691a4; font-size:13.5px; font-weight:600;
}
.progress-outer{width:100%; height:8px; background:var(--blue-light); border-radius:999px; overflow:hidden; margin:14px 0;}
.progress-inner{height:100%; background:var(--blue); border-radius:999px; transition:.4s;}

/* Modal — profil complet */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(6,20,32,0.55); z-index:100;
  align-items:center; justify-content:center; padding:24px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#fff; border-radius:14px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  padding:0; box-shadow:0 20px 60px rgba(6,20,32,0.35); animation:modalin .2s ease;
}
@keyframes modalin{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{
  padding:22px 26px; background:linear-gradient(135deg,var(--blue-darker),var(--blue-dark)); color:#fff;
  border-radius:14px 14px 0 0; position:relative;
}
.modal-close{position:absolute; top:16px; right:18px; background:rgba(255,255,255,0.15); color:#fff; width:28px;height:28px; border-radius:50%; font-size:16px; line-height:1;}
.modal-close:hover{background:rgba(255,255,255,0.28);}
.modal-avatar{
  width:52px;height:52px; border-radius:50%; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:17px; margin-bottom:12px;
}
.modal-head h3{font-size:19px; color:#fff;}
.modal-head .role{font-size:12.5px; color:#cfe4f5; font-weight:600; margin-top:3px;}
.modal-body{padding:22px 26px 26px 26px;}
.modal-score-row{display:flex; align-items:center; gap:14px; margin-bottom:18px; padding:14px 16px; background:var(--paper); border-radius:10px;}
.modal-score-row .num{font-size:26px; font-weight:800;}
.modal-meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
.modal-meta-grid .mi{font-size:12px; color:#7691a4; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.modal-meta-grid .mv{font-size:13.5px; font-weight:600; margin-top:2px;}

/* Chat — création de poste conversationnelle */
.chat-window{
  display:flex; flex-direction:column; gap:10px; max-height:360px; overflow-y:auto;
  padding:6px 4px 14px 4px; margin-bottom:14px;
}
.chat-row{display:flex;}
.chat-row.user{justify-content:flex-end;}
.chat-row.bot{justify-content:flex-start;}
.chat-bubble{max-width:78%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5;}
.chat-bubble.bot{background:var(--blue-light); color:var(--blue-darker); border-bottom-left-radius:4px;}
.chat-bubble.user{background:var(--blue-darker); color:#fff; border-bottom-right-radius:4px;}
.chat-input-row{display:flex; gap:10px; align-items:flex-end; border-top:1px solid var(--line); padding-top:14px;}
.chat-input-row textarea{flex:1; resize:none;}

/* Écran de connexion */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px;
  background:linear-gradient(135deg,var(--blue-darker),var(--blue-dark) 60%, var(--blue));
}
.login-card{
  background:#fff; border-radius:16px; padding:36px; width:100%; max-width:720px;
  box-shadow:0 30px 80px rgba(6,20,32,0.35);
}
.login-logo{display:flex; justify-content:center; margin-bottom:22px;}
.login-logo img{height:36px;}
.login-step-title{text-align:center; margin-bottom:6px;}
.login-step-sub{text-align:center; color:#587B95; font-size:13px; font-weight:600; margin-bottom:26px;}
.account-type-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.account-type-card{
  border:2px solid var(--line); border-radius:12px; padding:22px 18px; text-align:center; cursor:pointer; transition:.15s;
}
.account-type-card:hover{border-color:var(--blue); background:var(--paper);}
.account-type-card .icon{font-size:28px; margin-bottom:8px;}
.account-type-card h4{font-size:15px; margin-bottom:4px;}
.account-type-card p{font-size:12px; color:#587B95; font-weight:500;}
.persona-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.persona-card{
  border:2px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; transition:.15s; text-align:left;
  display:flex; gap:12px; align-items:flex-start;
}
.persona-card:hover{border-color:var(--blue); background:var(--paper);}
.persona-card .icon{font-size:22px; flex-shrink:0;}
.persona-card h4{font-size:13.5px; margin-bottom:3px;}
.persona-card p{font-size:11.5px; color:#587B95; font-weight:500; line-height:1.4;}
.login-back{background:none; color:#587B95; font-weight:700; font-size:12.5px; margin-bottom:14px; display:inline-flex; align-items:center; gap:4px;}
.login-back:hover{color:var(--blue-darker);}
.login-persona-badge{
  display:inline-flex; align-items:center; gap:8px; background:var(--blue-light); color:var(--blue-darker);
  border-radius:999px; padding:8px 16px; font-weight:700; font-size:13px; margin-bottom:20px;
}
.account-switcher{
  display:flex; align-items:center; gap:8px; padding:10px; margin-bottom:10px; border-radius:8px; background:rgba(255,255,255,0.08);
}
.account-switcher .info{flex:1; min-width:0;}
.account-switcher .info .name{color:#fff; font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.account-switcher .info .role{color:#9db8cd; font-size:10.5px; font-weight:600;}
.account-switcher button{background:rgba(255,255,255,0.14); color:#fff; border-radius:6px; padding:5px 9px; font-size:11px; font-weight:700;}
.account-switcher button:hover{background:rgba(255,255,255,0.26);}
.persona-banner{
  background:linear-gradient(135deg,var(--blue-darker),var(--blue-dark)); color:#fff; border-radius:var(--radius-m);
  padding:20px 22px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
}
.persona-banner h3{color:#fff; font-size:16px;}
.persona-banner p{color:#cfe4f5; font-size:12.5px; font-weight:500; margin-top:4px;}
.persona-tips{display:flex; gap:10px; flex-wrap:wrap;}
.persona-tips span, .persona-tips button{background:rgba(255,255,255,0.14); border-radius:999px; padding:6px 12px; font-size:11.5px; font-weight:600; color:#fff; cursor:pointer; transition:.15s; font-family:inherit;}
.persona-tips button:hover{background:rgba(255,255,255,0.28);}

@media(max-width:900px){
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; z-index:300; width:260px;
    transform:translateX(-100%); transition:transform .25s ease; display:flex;
  }
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(6,20,32,0.5); z-index:250;
  }
  .sidebar-backdrop.open{display:block;}
  .hamburger-btn{display:inline-flex !important;}
  .grid-2{grid-template-columns:1fr;}
  .grid-stats{grid-template-columns:repeat(2,1fr);}
  .pipeline{grid-template-columns:repeat(2,1fr);}
  .field-row{grid-template-columns:1fr;}
  .account-type-grid{grid-template-columns:1fr;}
  .persona-grid{grid-template-columns:1fr;}
  .login-card{padding:26px 20px;}
  .topbar{padding:14px 16px;}
  .view{padding:18px 16px 50px 16px;}
}

@media(min-width:901px) and (max-width:1180px){
  .grid-stats{grid-template-columns:repeat(2,1fr);}
  .sidebar{width:216px;}
}

@media(max-width:520px){
  .grid-stats{grid-template-columns:1fr 1fr;}
  .pipeline{grid-template-columns:1fr;}
  .topbar h1{font-size:16px;}
  .topbar .sub{display:none;}
  .card{padding:16px;}
  .cand-card{flex-direction:column;}
  .cand-actions{flex-direction:row; flex-wrap:wrap; width:100%;}
  .persona-banner{flex-direction:column; align-items:flex-start;}
}

.hamburger-btn{
  display:none; width:36px; height:36px; border-radius:8px; background:var(--paper); border:1px solid var(--line) !important;
  align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
/* ============================================================
   POLISH PASS — finitions visuelles (ombres, mouvement, profondeur)
   ============================================================ */

body{
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(24,122,205,0.05), transparent 60%),
    var(--paper);
}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#c7dae8; border-radius:999px; border:2px solid var(--paper);}
::-webkit-scrollbar-thumb:hover{background:#a9c3d8;}

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2px solid var(--blue); outline-offset:2px;
}

/* Cards: depth over borders */
.card{
  border:1px solid rgba(220,231,240,0.7);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow-sm);
  transition:box-shadow .25s var(--ease), transform .25s var(--ease);
}
.card:hover{box-shadow:var(--shadow-md);}
.stat, .cand-card, .opp-card, .pcard, .persona-card, .account-type-card{
  border-radius:var(--radius-m);
  box-shadow:var(--shadow-xs);
  transition:box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
}
.cand-card:hover, .opp-card:hover{box-shadow:var(--shadow-sm); transform:translateY(-1px);}
.stat{position:relative; overflow:hidden;}
.stat::before{
  content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--blue),var(--blue-light)); opacity:.9;
}
.stat.accent-ok::before{background:linear-gradient(90deg,var(--ok),#bdeed7);}
.stat.accent-warn::before{background:linear-gradient(90deg,var(--orange),#ffd9ad);}
.stat.accent-low::before{background:linear-gradient(90deg,var(--red),#f5b6b6);}

/* Buttons: tactile depth */
.btn{transition:transform .15s var(--ease), box-shadow .2s var(--ease), background .15s var(--ease);}
.btn-primary{box-shadow:0 4px 14px rgba(24,122,205,0.28);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(24,122,205,0.36);}
.btn-primary:active{transform:translateY(0); box-shadow:0 2px 8px rgba(24,122,205,0.28);}
.btn-orange{box-shadow:0 4px 14px rgba(245,128,37,0.28);}
.btn-orange:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(245,128,37,0.36);}
.btn-secondary:hover, .btn-ghost:hover{transform:translateY(-1px);}

/* Sidebar: refined active state with accent bar */
.sidebar{box-shadow:var(--shadow-lg);}
.nav-item{position:relative; transition:background .15s var(--ease), color .15s var(--ease), padding-left .15s var(--ease);}
.nav-item.active{
  background:linear-gradient(90deg, rgba(24,122,205,0.9), rgba(24,122,205,0.65));
  box-shadow:0 4px 14px rgba(24,122,205,0.35);
}
.nav-item.active::before{
  content:""; position:absolute; left:-16px; top:50%; transform:translateY(-50%);
  width:4px; height:20px; background:var(--orange); border-radius:0 4px 4px 0;
}
.nav-item:hover:not(.active){padding-left:14px;}
.brand{box-shadow:var(--shadow-sm);}

/* Topbar: sticky glass */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,0.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 1px 0 rgba(220,231,240,0.9);
}
.pill{box-shadow:var(--shadow-xs);}
.avatar{box-shadow:0 2px 8px rgba(13,82,152,0.35);}

/* Login screen: premium hero feel */
#login-screen{
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(245,128,37,0.18), transparent 60%),
    radial-gradient(900px 600px at 85% 90%, rgba(24,122,205,0.25), transparent 60%),
    linear-gradient(135deg,var(--blue-darker),var(--blue-dark) 55%, var(--blue));
}
.login-card{
  box-shadow:var(--shadow-lg);
  animation:loginIn .35s var(--ease);
}
@keyframes loginIn{from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:none;}}
.account-type-card, .persona-card{position:relative; overflow:hidden;}
.account-type-card::after, .persona-card::after{
  content:""; position:absolute; inset:0; background:linear-gradient(135deg, rgba(24,122,205,0.06), transparent 60%);
  opacity:0; transition:opacity .2s var(--ease);
}
.account-type-card:hover::after, .persona-card:hover::after{opacity:1;}
.account-type-card:hover, .persona-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-sm);}

/* Persona banner: subtle texture */
.persona-banner{
  position:relative; overflow:hidden; box-shadow:var(--shadow-md);
}
.persona-banner::before{
  content:""; position:absolute; top:-40%; right:-8%; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(245,128,37,0.35), transparent 65%);
}

/* Modal: crisper elevation */
.modal-box{box-shadow:var(--shadow-lg);}
.modal-overlay{backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}

/* Chips & tags: livelier */
.tag, .chip{transition:transform .15s var(--ease), box-shadow .15s var(--ease);}
.chip:not(.chip-add):hover, .tag:hover{box-shadow:var(--shadow-xs);}

/* Chat bubbles: soften */
.chat-bubble{box-shadow:var(--shadow-xs);}

/* View transition */
.view.active{animation:viewIn .3s var(--ease);}
@keyframes viewIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

@media(prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
</style>
</head>

/* ---------------- Dictionnaire d'extraction (langage naturel → critères) ---------------- */

const KEYWORD_MAP = [

  {re:/marketing/i, tag:'marketing', label:'Marketing'},
];

function extractYears(text){
  const m = text.match(/(\d+)\s*(?:ans|années|years)/i);
  return m ? parseInt(m[1],10) : null;
}

function extractLocation(text){
  if(/montr[ée]al/i.test(text)) return 'Montréal';
  if(/qu[ée]bec/i.test(text)) return 'Québec';
  if(/toronto/i.test(text)) return 'Toronto';
  if(/t[ée]l[ée]travail|remote|100%\s*distanciel|à distance/i.test(text)) return 'Télétravail';
  const m = text.match(/(?:^|\s)à\s+([A-ZÀ-Ý][a-zà-ÿ\-]+(?:\s[A-ZÀ-Ý][a-zà-ÿ\-]+)?)/);
  if(m) return m[1].trim();
  return '';
}

function extractTitle(text){
  let m = text.match(/(?:cherche|recherche|recrute[rz]?)\s+(?:un[e]?\s+|quelqu.?un\s+(?:de\s+)?)?(?:capable de travailler en tant que\s+)?([a-zàâäéèêëîïôöùûüç' \-]{3,40}?)(?=\s+(?:à|a)(?:\s|$)|[.,]|$)/i);
  if(m && m[1].trim().length>2) return capitalizeWords(m[1].trim());
  m = text.match(/en tant que\s+([a-zà-ÿ' \-]{3,40}?)(?=\s+(?:à|a)(?:\s|$)|[.,]|$)/i);
  if(m) return capitalizeWords(m[1].trim());
  return '';
}

function capitalizeWords(s){ return s.split(' ').map(w=> w.length ? w.charAt(0).toUpperCase()+w.slice(1) : w).join(' '); }

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function extractCriteria(text){
  const found = [];
  KEYWORD_MAP.forEach(k=>{ if(k.re.test(text)) found.push({tag:k.tag, label:k.label}); });
  found.push(...extractGenericSkills(text).filter(g=>!found.some(f=>f.tag===g.tag)));
  return found;
}

/* Extraction générique de compétences pour les métiers hors du référentiel KEYWORD_MAP
   (ex. "capable de travailler en tant que soudeur", "maîtrise de la soudure TIG") */
function extractGenericSkills(text){
  const out = [];
  const patterns = [
    /(?:capable de travailler en tant que|en tant que)\s+([a-zà-ÿ0-9' \-]{3,40})/gi,
    /(?:maîtris(?:e|ant|er)(?:\sde|\sla|\sdu)?|compétence(?:s)?\s(?:en|de)|connaissance(?:s)?\s(?:en|de|des)|savoir[- ]faire\s(?:en|de)|expérience\s(?:en|de|dans))\s+([a-zà-ÿ0-9' \-]{3,45})/gi,
  ];
  patterns.forEach(re=>{
    let m;
    while((m = re.exec(text)) !== null){
      let phrase = m[1].trim().split(/[.,;]| et | ou /i)[0].trim();
      phrase = phrase.replace(/^(la|le|les|du|des|de l'|d'|l')\s+/i,'').trim();
      phrase = phrase.replace(/\s*(indispensable|obligatoire|essentiel(?:le)?|requis(?:e)?|impératif|souhaitable|appréci[ée]e?|un plus)\s*$/i,'').trim();
      if(phrase.length < 2) continue;
      const tag = slugify(phrase);
      if(!tag || out.some(o=>o.tag===tag)) continue;
      out.push({tag, label: capitalizeWords(phrase), _index: m.index});
    }
  });
  return out;
}

function classifyGenericImportance(text, item){
  if(item._index === undefined) return 'important';
  const before = text.slice(Math.max(0, item._index-45), item._index);
  const after = text.slice(item._index, item._index+70);
  if(/indispensable|obligatoire|impératif|essentiel|doit (?:absolument|impérativement)?/i.test(before)) return 'must';
  if(/atout|souhaitable|apprécié|un plus|idéalement/i.test(before+after)) return 'nice';
  return 'important';
}

/* Classement heuristique des critères par importance selon des marqueurs de langage */
function classifyImportance(text, item){
  const mustTags = ['bilingue','gestion-equipe'];
  const niceTags = ['strategie','grands-comptes','marketing'];
  if(mustTags.includes(item.tag)) return 'must';
  if(niceTags.includes(item.tag)) return 'nice';
  if(item._index !== undefined) return classifyGenericImportance(text, item);
  return 'important';
}

/* ---------------- Moteur de matching pondéré ---------------- */

function scoreCandidate(candidate, job){
  const weights = {must:3, important:2, nice:1};
  let total = 0, max = 0;
  const matched = [], missing = [];

  ['must','important','nice'].forEach(bucket=>{
    (job[bucket]||[]).forEach(tag=>{
      max += weights[bucket];
      if(candidate.tags.includes(tag)){
        total += weights[bucket];
        matched.push({tag, bucket});
      } else {
        missing.push({tag, bucket});
      }
    });
  });

  // bonus mineur pour l'expérience si le poste attend un profil senior
  if(job.minYears && candidate.years){
    max += 1;
    if(candidate.years >= job.minYears) total += 1;
    else missing.push({tag:`${job.minYears}+ ans d'expérience`, bucket:'important', raw:true});
  }

  const pct = max > 0 ? Math.round((total/max)*100) : 0;
  return {pct, matched, missing};
}

function tagLabel(tag){
  const found = KEYWORD_MAP.find(k=>k.tag===tag);
  return found ? found.label : tag;
}

function bucketFor(pct){
  if(pct>=88) return {name:'Fortement recommandés', color:'#1E9E6B'};
  if(pct>=72) return {name:'Bons matchs', color:'#187ACD'};
  if(pct>=50) return {name:'À examiner', color:'#F58025'};
  return {name:'Faible correspondance', color:'#D30909'};
}

function chooseAccountType(type){
  loginAccountType = type;
  if(type==='recruteur'){ loginStep = 'persona'; }
  else { loginStep = 'form'; }
  renderLoginScreen();
}

function choosePersona(personaId){
  session.pendingPersona = personaId;
  loginStep = 'form';
  renderLoginScreen();
}

function doLogin(){
  const name = (document.getElementById('login-name').value || '').trim();
  session.loggedIn = true;
  session.accountType = loginAccountType;
  session.persona = loginAccountType==='recruteur' ? PERSONAS[session.pendingPersona] : null;
  session.name = name || (loginAccountType==='recruteur' ? 'Recruteur' : 'Candidat');

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  setMode(loginAccountType);
}

function logout(){
  session = { loggedIn:false, accountType:null, persona:null, name:'' };
  loginStep = 'account-type';
  loginAccountType = null;
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  renderLoginScreen();
}

function setMode(mode){
  currentMode = mode;
  if(mode==='recruteur') renderRecruiterNav();
  document.getElementById('nav-recruteur').style.display = mode==='recruteur' ? 'block':'none';
  document.getElementById('nav-candidat').style.display = mode==='candidat' ? 'block':'none';
  document.getElementById('topbar-pill').textContent = mode==='recruteur' && session.persona ? session.persona.label : (mode==='recruteur' ? 'Recruteur' : 'Candidat');
  document.getElementById('topbar-avatar').textContent = session.name ? session.name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase() : (mode==='recruteur' ? 'GT' : 'VO');

  setView(mode==='recruteur' ? 'r-dashboard' : 'c-profile');

function setView(view){
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.view===view);
  });
  const meta = VIEW_META[view];
  const title = (view==='r-persona' && session.persona) ? session.persona.navLabel : meta.title;
  const sub = (view==='r-persona' && session.persona) ? session.persona.tagline : meta.sub;
  document.getElementById('topbar-title').textContent = title;
  document.getElementById('topbar-sub').textContent = sub;
  closeMobileSidebar();
  render();
}

function render(){
  const c = document.getElementById('views-container');
  c.classList.remove('active');
  void c.offsetWidth; // force reflow to restart the entrance animation
  c.innerHTML = RENDERERS[currentView]();
  c.classList.add('active');
  if(typeof AFTER_RENDER[currentView] === 'function') AFTER_RENDER[currentView]();
}

function computeAllScores(){
  return CANDIDATE_POOL.map(cand=>({cand, ...scoreCandidate(cand, currentJob)}))
    .sort((a,b)=>b.pct-a.pct);
}

function renderDashboard(){
  if(!currentJob.title){
    return `
      ${personaBannerHTML()}
      <div class="card empty">

        <button class="btn btn-primary" onclick="setView('r-create')">Créer mon premier poste</button>
      </div>`;
  }
  const scores = computeAllScores();
  const counts = {rec:0, good:0, review:0, low:0};
  scores.forEach(s=>{

    else if(s.pct>=72) counts.good++;

    else counts.low++;

  return `

let creationMode = 'nl';
let nlDraftCriteria = {must:[], important:[], nice:[]};

/* --- État de la conversation "Créer un poste" --- */
let chatMessages = [];
let chatDraft = null;
let chatPendingField = null; // null | 'title' | 'location' | 'skills' | 'years'
let chatDone = false;

function resetChat(){
  chatDraft = {title:'', location:'', years:null, askedYears:false, criteria:[]};
  chatPendingField = null;
  chatDone = false;
  chatMessages = [{who:'bot', text:'Décrivez le poste que vous recherchez, comme vous le feriez à un collègue. Je vous poserai des questions s\u2019il me manque des informations essentielles.'}];
}

function renderCreate(){
  if(creationMode==='nl' && !chatDraft) resetChat();
  return `
    <div class="card">
      <div class="seg">
        <button class="${creationMode==='nl'?'active':''}" onclick="switchCreationMode('nl')">Langage naturel</button>
        <button class="${creationMode==='form'?'active':''}" onclick="switchCreationMode('form')">Formulaire classique</button>
      </div>

      ${creationMode==='nl' ? renderChatUI() : `
        <div class="field-row">
          <div class="field"><label>Titre du poste</label><input id="f-title" value="${currentJob.title||''}" placeholder="Ex. Directeur des ventes"></div>
          <div class="field"><label>Localisation</label><input id="f-location" value="${currentJob.location||''}" placeholder="Ex. Montréal"></div>
        </div>
        <div class="field"><label>Description / responsabilités</label><textarea id="f-desc" rows="3" placeholder="Décrivez les responsabilités principales...">${currentJob.description||''}</textarea></div>
        <div class="field-row">
          <div class="field"><label>Compétences & expérience attendues</label><textarea id="f-skills" rows="2" placeholder="Ex. B2B, gestion d'équipe, négociation, 5 ans d'expérience, bilingue français/anglais"></textarea></div>
          <div class="field"><label>Langues / formation / conditions</label><textarea id="f-extra" rows="2" placeholder="Ex. Bilingue, formation en administration, salaire compétitif"></textarea></div>
        </div>
        <button class="btn btn-primary" onclick="analyzeForm()">Générer les critères</button>
      `}
    </div>

    ${(nlDraftCriteria.must.length || nlDraftCriteria.important.length || nlDraftCriteria.nice.length) ? `
    <div class="card">
      <div class="card-head"><h3>Critères identifiés par Jobalso</h3><div class="desc">Modifiez ou confirmez avant publication</div></div>
      ${renderCriteriaBlock('must','Critères obligatoires — must-have')}
      ${renderCriteriaBlock('important','Critères importants')}
      ${renderCriteriaBlock('nice','Critères souhaitables — nice-to-have')}
      <div style="margin-top:18px; display:flex; gap:10px;">
        <button class="btn btn-primary" onclick="confirmCriteria()">Confirmer les critères →</button>
      </div>
    </div>
    ` : ''}
  `;
}

function renderCriteriaBlock(bucket, title){
  const items = nlDraftCriteria[bucket];
  const cls = bucket==='must'?'must':bucket==='important'?'important':'nice';
  return `
    <div class="crit-block">
      <div class="crit-title ${cls}"><span class="swatch"></span>${title}</div>
      <div class="chips">
        ${items.map((it,i)=>`<div class="chip">${it.label}<button onclick="removeCriterion('${bucket}',${i})">×</button></div>`).join('') || '<span class="hint">Aucun critère dans cette catégorie</span>'}
        <button class="chip chip-add" onclick="addCriterion('${bucket}')">+ Ajouter</button>
      </div>
    </div>
  `;
}

function switchCreationMode(m){
  creationMode = m;
  render();
}

function renderChatUI(){
  const bubbles = chatMessages.map(m=>`
    <div class="chat-row ${m.who}">
      <div class="chat-bubble ${m.who}">${m.text}</div>
    </div>
  `).join('');
  return `
    <div class="chat-window" id="chat-window">${bubbles}</div>
    ${chatDone ? `
      <div class="chat-input-row">
        <button class="btn btn-ghost btn-sm" onclick="resetChat(); render();">Recommencer</button>
      </div>
    ` : `
      <div class="chat-input-row">
        <textarea id="chat-input" rows="2" placeholder="${chatPlaceholder()}" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendChatMessage(); }"></textarea>
        <button class="btn btn-primary" onclick="sendChatMessage()">Envoyer</button>
      </div>
    `}
  `;
}

function chatPlaceholder(){
  if(chatPendingField==='title') return 'Ex. Directeur des ventes';
  if(chatPendingField==='location') return 'Ex. Montréal, ou télétravail';
  if(chatPendingField==='skills') return 'Ex. bilingue, gestion d\u2019équipe, 5 ans d\u2019expérience...';
  if(chatPendingField==='years') return 'Ex. 5 ans, ou "aucun minimum"';
  return 'Ex. Je cherche un directeur des ventes à Montréal, bilingue, avec 5 ans d\u2019expérience en B2B et ayant déjà géré une équipe.';
}

function scrollChatToBottom(){
  const w = document.getElementById('chat-window');
  if(w) w.scrollTop = w.scrollHeight;
}

function pushBot(text){ chatMessages.push({who:'bot', text}); }
function pushUser(text){ chatMessages.push({who:'user', text}); }

function mergeExtraction(text){
  if(!chatDraft.title){ const t = extractTitle(text); if(t) chatDraft.title = t; }
  if(!chatDraft.location){ const l = extractLocation(text); if(l) chatDraft.location = l; }
  if(chatDraft.years===null){ const y = extractYears(text); if(y) chatDraft.years = y; }
  extractCriteria(text).forEach(item=>{
    if(!chatDraft.criteria.some(c=>c.tag===item.tag)) chatDraft.criteria.push(item);
  });
}

function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const text = (input.value||'').trim();
  if(!text) return;
  pushUser(text);

  if(chatPendingField==='title'){
    chatDraft.title = capitalizeWords(text.replace(/^(un|une|le|la)\s+/i,''));
  } else if(chatPendingField==='location'){
    chatDraft.location = capitalizeWords(text);
  } else if(chatPendingField==='years'){
    if(/aucun|non|pas de|n\/a|indifférent/i.test(text)){ chatDraft.years = 0; }
    else { const y = extractYears(text) || parseInt(text,10); if(y) chatDraft.years = y; }
    chatDraft.askedYears = true;
  } else if(chatPendingField==='skills'){
    extractCriteria(text).forEach(item=>{ if(!chatDraft.criteria.some(c=>c.tag===item.tag)) chatDraft.criteria.push(item); });
    if(!chatDraft.criteria.length){
      // fallback : on transforme la réponse libre en un critère générique
      chatDraft.criteria.push({tag:slugify(text), label:capitalizeWords(text.split(/[.,;]/)[0])});
    }
  }
  // dans tous les cas, on tente aussi une extraction générale (utile dès le 1er message)
  mergeExtraction(text);

  askNextOrFinish();
  render();
}

function askNextOrFinish(){
  if(!chatDraft.title){
    chatPendingField = 'title';
    pushBot('Quel est l\u2019intitulé exact du poste ?');
    return;
  }
  if(!chatDraft.location){
    chatPendingField = 'location';
    pushBot(`Bien noté pour « ${chatDraft.title} ». Où ce poste sera-t-il basé (ville, télétravail, hybride) ?`);
    return;
  }
  if(!chatDraft.criteria.length){
    chatPendingField = 'skills';
    pushBot('Quelles compétences, qualifications ou langues sont indispensables pour ce poste ?');
    return;
  }
  if(chatDraft.years===null && !chatDraft.askedYears){
    chatPendingField = 'years';
    pushBot('Combien d\u2019années d\u2019expérience minimum recherchez-vous ? (tapez "aucun" si non applicable)');
    return;
  }
  // tout est réuni
  chatPendingField = null;
  chatDone = true;
  finalizeChatDraft();
  const mustLabels = nlDraftCriteria.must.map(i=>i.label).join(', ') || 'aucun';
  pushBot(`Parfait, j\u2019ai tout ce qu\u2019il me faut ✅<br><br><b>${chatDraft.title}</b> — ${chatDraft.location}${chatDraft.years?` · ${chatDraft.years}+ ans d\u2019expérience`:''}<br>Critères obligatoires : ${mustLabels}<br><br>Vérifiez les critères ci-dessous puis confirmez pour générer l\u2019offre.`);
}

function finalizeChatDraft(){
  nlDraftCriteria = {must:[], important:[], nice:[]};
  chatDraft.criteria.forEach(item=>{
    const bucket = classifyImportance(chatMessages.map(m=>m.text).join(' '), item);
    nlDraftCriteria[bucket].push(item);
  });
  if(chatDraft.years){
    nlDraftCriteria.must.push({tag:`exp-${chatDraft.years}`, label:`${chatDraft.years}+ ans d\u2019expérience`, minYears:chatDraft.years});
  }
  currentJob.title = chatDraft.title;
  currentJob.location = chatDraft.location;
  currentJob.description = chatMessages.filter(m=>m.who==='user').map(m=>m.text).join(' ');
  currentJob.rawText = currentJob.description;
}

function analyzeForm(){
  const title = document.getElementById('f-title').value.trim();
  const location = document.getElementById('f-location').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const skills = document.getElementById('f-skills').value.trim();
  const extra = document.getElementById('f-extra').value.trim();
  const combined = [desc, skills, extra].join(' ');
  const years = extractYears(combined);
  const found = extractCriteria(combined);

  nlDraftCriteria = {must:[], important:[], nice:[]};
  found.forEach(item=>{
    const bucket = classifyImportance(combined, item);
    nlDraftCriteria[bucket].push(item);
  });
  if(years){
    nlDraftCriteria.must.push({tag:`exp-${years}`, label:`${years}+ ans d'expérience`, minYears:years});
  }
  currentJob.title = title || 'Poste sans titre';
  currentJob.location = location;
  currentJob.description = desc || combined;
  render();
}

function removeCriterion(bucket, idx){
  nlDraftCriteria[bucket].splice(idx,1);
  render();
}

function addCriterion(bucket){
  const label = prompt('Nom du critère à ajouter :');
  if(!label) return;
  const tag = label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
  nlDraftCriteria[bucket].push({tag, label});
  render();
}

function confirmCriteria(){
  currentJob.must = nlDraftCriteria.must.map(i=>i.tag);
  currentJob.important = nlDraftCriteria.important.map(i=>i.tag);
  currentJob.nice = nlDraftCriteria.nice.map(i=>i.tag);
  const yearsItem = [...nlDraftCriteria.must].find(i=>i.minYears);
  if(yearsItem) currentJob.minYears = yearsItem.minYears;
  setView('r-offer');
}

function renderShortlist(){
  if(!currentJob.title || (!currentJob.must.length && !currentJob.important.length && !currentJob.nice.length)){
    return `<div class="card empty">Confirmez les critères d\u2019un poste pour générer une shortlist.<br><br><button class="btn btn-primary" onclick="setView('r-create')">Créer un poste</button></div>`;
  }
  const scored = computeAllScores();
  const buckets = [
    {key:'rec', name:'Fortement recommandés', color:'#1E9E6B', test:s=>s.pct>=88},
    {key:'good', name:'Bons matchs', color:'#187ACD', test:s=>s.pct>=72 && s.pct<88},
    {key:'review', name:'À examiner', color:'#F58025', test:s=>s.pct>=50 && s.pct<72},
    {key:'low', name:'Faible correspondance', color:'#D30909', test:s=>s.pct<50},
  ];
  let html = `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <div><h3 style="font-size:15px;">${CANDIDATE_POOL.length} candidatures analysées</h3><div class="desc">Triées et expliquées automatiquement par le moteur de matching</div></div>
    <button class="btn btn-secondary btn-sm" onclick="setView('r-compare')">Comparer la sélection (${compareIds.size})</button>
  </div>`;

  buckets.forEach(b=>{
    const items = scored.filter(b.test);
    html += `<div class="bucket-title"><h3>${b.name}</h3><span class="bucket-count" style="background:${b.color};">${items.length}</span></div>`;
    if(!items.length){ html += `<div class="card empty" style="padding:20px;">Aucun candidat dans cette catégorie</div>`; return; }
    html += `<div class="cand-list">`;
    items.forEach(s=>{
      html += renderCandCard(s, b.color);
    });
    html += `</div>`;
  });
  return html;
}

function renderCandCard(s, color){
  const c = s.cand;
  const inShort = shortlistIds.has(c.id);
  const inCompare = compareIds.has(c.id);
  const okReasons = s.matched.slice(0,4).map(m=>`<div class="why ok">✅ ${tagLabel(m.tag)}</div>`).join('');
  const warnReasons = s.missing.slice(0,2).map(m=>`<div class="why warn">⚠️ ${m.raw ? m.tag : 'Écart sur : '+tagLabel(m.tag)}</div>`).join('');
  return `
    <div class="cand-card">
      <div class="cand-score" style="background:${color};">${s.pct}%</div>
      <div class="cand-main">
        <div class="name-row">
          <div><h4>${c.name}</h4><div class="role">${c.role} · ${c.years} ans d\u2019expérience</div></div>
        </div>
        <div class="reasons">${okReasons}${warnReasons}</div>
      </div>
      <div class="cand-actions">
        <button class="btn btn-sm ${inShort?'btn-secondary':'btn-primary'}" onclick="toggleShortlist('${c.id}')">${inShort? '✓ Dans la shortlist':'Ajouter à la shortlist'}</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleCompare('${c.id}')">${inCompare?'Retirer du comparatif':'Comparer'}</button>
        <button class="btn btn-ghost btn-sm" onclick="openProfileModal('${c.id}')">Voir le profil</button>
      </div>
    </div>
  `;
}

let bankSearch = '';

function renderBank(){
  return `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
      <div>
        <h3 style="font-size:15px;">${CANDIDATE_POOL.length} profils intégrés à Jobalso</h3>

    </div>
    <div class="cand-list" id="bank-list-container"></div>
  `;
}

function bankListHTML(){
  const hasJob = !!(currentJob.must.length || currentJob.important.length || currentJob.nice.length);
  const list = CANDIDATE_POOL
    .map(cand=> hasJob ? {cand, ...scoreCandidate(cand, currentJob)} : {cand, pct:null, matched:[], missing:[]})
    .filter(s=>{
      const q = bankSearch.toLowerCase();
      if(!q) return true;
      return s.cand.name.toLowerCase().includes(q) || s.cand.role.toLowerCase().includes(q) ||
             s.cand.sector.toLowerCase().includes(q) || s.cand.tags.some(t=>tagLabel(t).toLowerCase().includes(q));
    });
  if(hasJob) list.sort((a,b)=>b.pct-a.pct);
  const desc = hasJob ? 'Triés selon le poste actif · '+currentJob.title : 'Aucun poste actif — créez un poste pour voir le score de compatibilité';
  const descEl = document.getElementById('bank-desc');
  if(descEl) descEl.textContent = desc;
  return list.map(s=>renderBankCard(s, hasJob)).join('') || '<div class="card empty">Aucun profil ne correspond à cette recherche</div>';
}

function updateBankList(){
  const el = document.getElementById('bank-list-container');
  if(!el) return;
  const input = document.getElementById('bank-search-input');
  const pos = input ? input.selectionStart : null;
  el.innerHTML = bankListHTML();
  if(input && pos!==null){ input.focus(); input.setSelectionRange(pos,pos); }
}

function renderBankCard(s, hasJob){
  const c = s.cand;
  const color = hasJob ? bucketFor(s.pct).color : '#587B95';
  const inShort = shortlistIds.has(c.id);
  return `
    <div class="cand-card">

function toggleCompare(id){
  if(compareIds.has(id)) compareIds.delete(id);

}

/* ============================================================
   RECRUTEUR — Comparaison
   ============================================================ */

function renderCompare(){
  if(compareIds.size===0){
    return `<div class="card empty">Sélectionnez jusqu\u2019à 3 candidats depuis la shortlist pour les comparer.<br><br><button class="btn btn-primary" onclick="setView('r-shortlist')">Aller à la shortlist</button></div>`;
  }
  const chosen = [...compareIds].map(id=>{
    const cand = CANDIDATE_POOL.find(c=>c.id===id);
    return {cand, ...scoreCandidate(cand, currentJob)};
  });
  const criteriaRows = [
    {label:'Expérience', fn:s=>s.cand.years>=8?'Très forte':s.cand.years>=5?'Forte':'Moyenne'},
    {label:'Bilinguisme', fn:s=>s.cand.tags.includes('bilingue')?'Oui':'Non'},
    {label:'Gestion d\u2019équipe', fn:s=>s.cand.tags.includes('gestion-equipe')?'Oui':'Non'},
    {label:'Expérience B2B', fn:s=>s.cand.tags.includes('b2b')?'Oui':'Non'},
    {label:'Localisation', fn:s=>s.cand.location},
  ];
  return `
    <div class="card">
      <div class="card-head"><h3>Comparaison des candidats</h3><div class="desc">${chosen.length} profil${chosen.length>1?'s':''} sélectionné${chosen.length>1?'s':''}</div></div>
      <div style="overflow-x:auto;">
      <table class="compare">
        <thead><tr><th>Critère</th>${chosen.map(s=>`<th>${s.cand.name}</th>`).join('')}</tr></thead>
        <tbody>
          ${criteriaRows.map(row=>`<tr><td>${row.label}</td>${chosen.map(s=>`<td>${row.fn(s)}</td>`).join('')}</tr>`).join('')}
          <tr><td>Match</td>${chosen.map(s=>`<td class="match" style="color:${bucketFor(s.pct).color};">${s.pct}%</td>`).join('')}</tr>
        </tbody>
      </table>
      </div>
    </div>
  `;
}

/* ============================================================
   RECRUTEUR — Pipeline
   ============================================================ */

function renderPipeline(){
  const ids = [...shortlistIds];
  if(!ids.length){
    return `<div class="card empty">Ajoutez des candidats à votre shortlist pour les suivre dans le pipeline.<br><br><button class="btn btn-primary" onclick="setView('r-shortlist')">Aller à la shortlist</button></div>`;
  }
  let html = `<div class="pipeline">`;
  PIPELINE_STAGES.forEach((stageName, idx)=>{
    const inStage = ids.filter(id=>(pipeline[id]||0)===idx);
    html += `<div class="pcol"><h4>${stageName}<span>${inStage.length}</span></h4>`;
    inStage.forEach(id=>{
      const c = CANDIDATE_POOL.find(cc=>cc.id===id);
      html += `<div class="pcard">
        <div class="pname">${c.name}</div>
        <div style="color:#587B95; font-size:11.5px;">${c.role}</div>
        <div class="pmove">
          ${idx>0 ? `<button onclick="movePipeline('${id}',${idx-1})">← Retour</button>` : ''}
          ${idx<PIPELINE_STAGES.length-1 ? `<button onclick="movePipeline('${id}',${idx+1})">Avancer →</button>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function movePipeline(id, newStage){
  pipeline[id] = newStage;
  render();
}

function exportCV(format){
  const cv = buildCVSections();
  const filenameBase = 'cv-jobalso-' + slugify(cv.name);

  if(format==='word'){
    const html = `
      <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset="utf-8"><title>${cv.name}</title></head>
      <body style="font-family:Calibri, Arial, sans-serif;">
        <h1 style="color:#0D5298; margin-bottom:0;">${cv.name}</h1>
        <p style="color:#444; margin-top:4px;">${cv.location} · ${cv.langues}</p>
        <p><b>Poste recherché :</b> ${cv.wantedRole}</p>
        <h2 style="color:#0D5298;">Domaines d'expérience</h2>
        <p>${cv.domains.join(' · ')}</p>
        <h2 style="color:#0D5298;">Compétences</h2>
        <p>${cv.skills.join(' · ')}</p>
        <h2 style="color:#0D5298;">Types de postes compatibles</h2>
        <p>${cv.compatiblePosts.join(' · ')}</p>
        <p style="margin-top:30px; color:#999; font-size:11px;">Généré par Jobalso — ${new Date().toLocaleDateString('fr-CA')}</p>
      </body></html>`;
    const blob = new Blob(['\ufeff', html], {type:'application/msword'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filenameBase + '.doc';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    return;
  }

  if(format==='pdf'){
    if(!(window.jspdf && window.jspdf.jsPDF)){
      alert('Le générateur PDF est en cours de chargement, réessayez dans un instant.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;
    doc.setTextColor(13,82,152); doc.setFontSize(20); doc.text(cv.name, 15, y); y+=8;
    doc.setTextColor(80,80,80); doc.setFontSize(11); doc.text(`${cv.location} · ${cv.langues}`, 15, y); y+=10;
    doc.setTextColor(20,20,20); doc.text(`Poste recherché : ${cv.wantedRole}`, 15, y); y+=12;

    const section = (title, items)=>{
      doc.setTextColor(13,82,152); doc.setFontSize(13); doc.text(title, 15, y); y+=7;
      doc.setTextColor(20,20,20); doc.setFontSize(11);
      const text = doc.splitTextToSize(items.join('  •  '), 180);
      doc.text(text, 15, y); y += text.length*6 + 8;
    };
    section("Domaines d'expérience", cv.domains);
    section('Compétences', cv.skills);
    section('Types de postes compatibles', cv.compatiblePosts);

    doc.setTextColor(150,150,150); doc.setFontSize(9);
    doc.text('Généré par Jobalso — ' + new Date().toLocaleDateString('fr-CA'), 15, 285);
    doc.save(filenameBase + '.pdf');
  }
}

function confirmWithdraw(jobId){
  const textarea = document.getElementById('withdraw-reason-'+jobId);
  const reason = (textarea.value||'').trim();

  delete withdrawnJobs[jobId];

        </div>

        <p class="hint" style="margin-top:10px;">Aucun recruteur humain n\u2019intervient : ujuzAI pose les questions, relance si nécessaire, puis vous remet un feedback immédiat.</p>
      </div>
    `;
  }
  const job = OPEN_JOBS.find(j=>j.id===interviewJobId);
  const bubbles = interviewChat.map(m=>`
    <div class="chat-row ${m.who}"><div class="chat-bubble ${m.who}">${m.text}</div></div>
  `).join('');
  return `
    <div class="card" style="margin-bottom:8px;"><h3 style="font-size:15px;">Entretien avec ujuzAI — ${job.title}</h3><div class="desc">${interviewDone ? 'Entretien terminé' : 'Entretien en cours · mené intégralement par l\u2019IA'}</div></div>
    <div class="card">
      <div class="chat-window" id="interview-chat-window">${bubbles}</div>
      ${interviewDone ? `
        <div class="chat-input-row">
          <button class="btn btn-ghost btn-sm" onclick="restartInterview()">Refaire une simulation</button>
          <button class="btn btn-ghost btn-sm" onclick="setView('c-matches')">Retour aux recommandations</button>
        </div>
      ` : `
        <div class="chat-input-row">
          <textarea id="interview-input" rows="2" placeholder="Votre réponse..." onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendInterviewMessage(); }"></textarea>
          <button class="btn btn-primary" onclick="sendInterviewMessage()">Envoyer</button>
        </div>
      `}
    </div>
    ${interviewDone ? renderInterviewFeedback() : ''}
  `;
}

function scrollInterviewToBottom(){
  const w = document.getElementById('interview-chat-window');
  if(w) w.scrollTop = w.scrollHeight;
}

function startInterview(){
  interviewJobId = document.getElementById('interview-job').value;
  const job = OPEN_JOBS.find(j=>j.id===interviewJobId);
  interviewAnswers = {};
  interviewQIndex = 0;
  interviewFollowupAsked = false;
  interviewStarted = true;
  interviewDone = false;
  const questions = buildQuestions(job);
  interviewChat = [
    {who:'bot', text:`Bonjour, je suis ujuzAI. Je vais mener votre entretien pour le poste de <b>${job.title}</b> chez ${job.company} — sans intervention humaine, à votre rythme. Commençons.`},
    {who:'bot', text:`<b>Question 1/${questions.length} · ${questions[0].type}</b><br>${questions[0].text}`},
  ];
  render();
}

function sendInterviewMessage(){
  const input = document.getElementById('interview-input');
  const text = (input.value||'').trim();
  if(!text) return;
  interviewChat.push({who:'user', text});

  const job = OPEN_JOBS.find(j=>j.id===interviewJobId);
  const questions = buildQuestions(job);
  const wordCount = text.split(/\s+/).filter(Boolean).length;

  interviewAnswers[interviewQIndex] = interviewAnswers[interviewQIndex] ? interviewAnswers[interviewQIndex] + ' ' + text : text;

  if(!interviewFollowupAsked && wordCount < 12){
    interviewFollowupAsked = true;
    interviewChat.push({who:'bot', text:'Merci. Pouvez-vous préciser avec un exemple concret — contexte, action, résultat ?'});
    render();
    return;
  }

  interviewFollowupAsked = false;
  interviewQIndex++;

  if(interviewQIndex < questions.length){
    interviewChat.push({who:'bot', text:`Merci pour votre réponse.<br><br><b>Question ${interviewQIndex+1}/${questions.length} · ${questions[interviewQIndex].type}</b><br>${questions[interviewQIndex].text}`});
  } else {
    interviewChat.push({who:'bot', text:'Merci, nous avons couvert l\u2019ensemble des questions. L\u2019entretien est terminé — voici votre feedback détaillé ci-dessous.'});
    interviewDone = true;
  }
  render();
}

function renderInterviewFeedback(){
  const job = OPEN_JOBS.find(j=>j.id===interviewJobId);
  const answers = Object.values(interviewAnswers);
  const totalWords = answers.reduce((s,a)=>s + (a? a.trim().split(/\s+/).length : 0), 0);
  const answered = answers.filter(a=>a && a.trim().length>0).length;
  const avgWords = answered ? Math.round(totalWords/answered) : 0;

  const strengths = [];
  const improve = [];
  if(answered>=3) strengths.push('Vous avez répondu à la majorité des questions — bonne endurance face à l\u2019exercice.');
  else improve.push('Essayez de répondre à toutes les questions, même brièvement, pour une évaluation complète.');
  if(avgWords>=40) strengths.push('Vos réponses sont détaillées et illustrées d\u2019exemples concrets.');
  else if(avgWords>0) improve.push('Développez davantage vos réponses avec des exemples concrets (méthode situation → action → résultat).');
  if(answers.some(a=>a && /résultat|chiffre|%|augment|réduit/i.test(a))) strengths.push('Vous appuyez vos propos avec des résultats mesurables — très apprécié en entrevue de vente.');
  else improve.push('Ajoutez des résultats chiffrés quand c\u2019est possible : cela renforce la crédibilité de vos réponses.');

  return `
    <div class="card">
      <div class="card-head"><h3>Feedback ujuzAI — ${job.title}</h3><div class="desc">Généré automatiquement à partir de vos ${answered} réponse${answered>1?'s':''}, sans relecture humaine</div></div>
      <div class="explain-col" style="margin-bottom:16px;">
        <h5>Points forts</h5>
        ${strengths.map(s=>`<div class="feedback-item"><span class="ic" style="color:#1E9E6B;">✓</span>${s}</div>`).join('')}
      </div>
      <div class="explain-col">
        <h5>Pistes d\u2019amélioration</h5>
        ${improve.map(s=>`<div class="feedback-item"><span class="ic" style="color:var(--orange);">!</span>${s}</div>`).join('')}
      </div>
    </div>
  `;
}

function restartInterview(){
  interviewStarted = false;
  interviewDone = false;
  interviewAnswers = {};
  interviewChat = [];
  interviewQIndex = 0;
  interviewFollowupAsked = false;
  render();
}
