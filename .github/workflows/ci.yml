name: CI

on:
  push:
    branches: [main, dev/boly]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, sécurité et tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobalso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d jobalso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/jobalso_test
      DATABASE_URL: postgresql://test:test@localhost:5432/jobalso_test
      SECRET_KEY: cle-de-ci-uniquement
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ci
      MINIO_SECRET_KEY: ci
      MINIO_BUCKET: cv-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app alembic/env.py

      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Tests unitaires et d'intégration (migrations comprises)
        run: pytest

      - name: Modèles et migrations cohérents
        run: alembic check

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jobalso-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: L'image ne tourne pas en root
        run: test "$(docker run --rm jobalso-api:ci id -u)" = "10001"
